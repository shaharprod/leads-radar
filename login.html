<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כניסה — רדאר מפת הלידים</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F6FB;font-family:Arial,"Segoe UI",sans-serif;color:#13294B}
  .box{width:min(420px,92vw);background:#fff;border:1px solid #C9D4E5;border-radius:14px;padding:28px 24px}
  h1{margin:0 0 6px;font-size:1.5rem}
  p{margin:0 0 18px;color:#43597C;line-height:1.6}
  #status{margin-top:14px;font-weight:bold}
  .ok{color:#1F8A5B}.bad{color:#C2412D}
  a.btn,button{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:8px;border:0;background:#13294B;color:#fff;text-decoration:none;font-size:1rem;cursor:pointer}
  button.ghost{background:#fff;color:#13294B;border:1px solid #13294B;margin-inline-start:8px}
  #stytch-login{direction:ltr}
</style>
</head>
<body>
<div class="box">
  <h1>כניסה לרדאר מפת הלידים</h1>
  <p id="intro">הזן את כתובת המייל <b>ששילמת איתו</b>. תקבל למייל קוד חד-פעמי בן 6 ספרות — בלי סיסמה. עדיין אין מנוי? <a href="sales.html">לדף המנוי</a>.</p>
  <div id="stytch-login"></div>
  <div id="loggedin" hidden>
    <div id="status" class="ok"></div>
    <a class="btn" href="./">כניסה לכלי</a>
    <button class="ghost" id="logout" type="button">התנתקות</button>
  </div>
  <div id="error" class="bad" hidden></div>
  <p style="margin:18px 0 0;font-size:.85rem;color:#43597C">הכניסה מהווה הסכמה ל<a href="https://shaharprod.github.io/leads-radar/legal/terms.html" target="_blank" rel="noopener">תנאי השימוש</a> ול<a href="https://shaharprod.github.io/leads-radar/legal/privacy.html" target="_blank" rel="noopener">מדיניות הפרטיות</a>. עזרה: <a href="https://shaharprod.github.io/leads-radar/help.html" target="_blank" rel="noopener">מדריך למשתמש</a>.</p>
</div>

<script type="module">
  import { StytchUIClient } from "https://esm.sh/@stytch/vanilla-js@5.45.1";

  const PUBLIC_TOKEN = "public-token-live-2d63e7da-99ba-47f6-9b06-14c03f61fb61"; // Stytch Live
  const BACK = "https://shaharprod.github.io/leads-radar/login.html";
  const SESSION_MIN = 10080; // 7 ימים

  const $ = (id) => document.getElementById(id);
  const stytch = new StytchUIClient(PUBLIC_TOKEN);

  function render() {
    const session = stytch.session.getSync();
    const user = stytch.user.getSync();
    if (session) {
      $("stytch-login").hidden = true;
      $("intro").hidden = true;
      $("loggedin").hidden = false;
      const mail = user && user.emails && user.emails[0] ? user.emails[0].email : "";
      $("status").textContent = "מחובר" + (mail ? ": " + mail : "");
    } else {
      $("stytch-login").hidden = false;
      $("intro").hidden = false;
      $("loggedin").hidden = true;
    }
  }

  function showError(msg) {
    $("error").hidden = false;
    $("error").textContent = msg;
  }

  // חזרה מקישור הכניסה במייל
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  if (token && params.get("stytch_token_type") === "magic_links") {
    try {
      await stytch.magicLinks.authenticate(token, { session_duration_minutes: SESSION_MIN });
      history.replaceState(null, "", location.pathname);
    } catch (e) {
      showError("קישור הכניסה לא תקף או שפג תוקפו. בקש קישור חדש.");
    }
  }

  stytch.mountLogin({
    elementId: "#stytch-login",
    config: {
      products: ["otp"],
      otpOptions: { methods: ["email"], expirationMinutes: 10 },
      sessionOptions: { sessionDurationMinutes: SESSION_MIN }
    }
  });

  stytch.session.onChange(() => { render(); const s = stytch.session.getSync(); if (s && !params.get("stay")) location.replace("./" + (params.get("next") ? decodeURIComponent(params.get("next")) : "")); });
  $("logout").addEventListener("click", async () => {
    try { await stytch.session.revoke(); } catch (e) {}
    render();
  });
  render();
  // already logged in and came here by mistake → straight to the tool
  if (stytch.session.getSync() && !params.get("stay")) location.replace("./");
</script>
</body>
</html>
